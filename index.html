<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경남 대형병원 주변 약국 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FCFDFC; --ink:#1E2A27; --muted:#66746F; --line:#DCE3E0; --tint:#EEF3F1;
  --hosp:#24479A; --hosp-soft:#E7ECF7; --rx:#0F7A58; --rx-soft:#E3F1EB; --ring:#C98A00; --ring-soft:#FFF4D6;
  --panel-w:392px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"IBM Plex Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--paper);
  font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;display:grid;grid-template-columns:var(--panel-w) 1fr;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:var(--hosp)}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}

/* ---------- panel ---------- */
#panel{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--paper)}
.masthead{padding:20px 20px 14px}
.masthead h1{font-size:19px;line-height:1.3;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.masthead p{margin:0;color:var(--muted);font-size:13px}
.controls{padding:0 20px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.regions{display:flex;flex-wrap:wrap;gap:6px}
.regions button{padding:4px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:#fff}
.regions button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--hosp);width:16px;height:16px;margin:0}
.scroll{overflow-y:auto;flex:1;min-height:0}

/* hospital list */
.h-row{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:12px;width:100%;padding:12px 20px;border-bottom:1px solid var(--line)}
.h-row:hover{background:var(--tint)}
.spec{display:flex;flex-direction:column;align-items:flex-end;color:var(--hosp)}
.spec b{font-size:26px;line-height:1;font-weight:600;letter-spacing:-.02em}
.spec small,.h-ph small{font-size:11px;color:var(--muted);margin-top:3px}
.h-name{display:block;font-weight:600;font-size:15px;line-height:1.35}
.h-meta{display:block;color:var(--muted);font-size:12.5px}
.h-ph{display:flex;flex-direction:column;align-items:center;min-width:44px;color:var(--rx)}
.h-ph b{font-size:17px;line-height:1;font-weight:600}
.tier{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:3px;margin-right:6px;vertical-align:1px;background:var(--hosp-soft);color:var(--hosp)}
.tier.t1{background:var(--hosp);color:#fff}
.empty{padding:24px 20px;color:var(--muted)}

/* detail */
.detail{padding:16px 20px 28px}
.back{font-size:13px;color:var(--muted);padding:4px 0;margin-bottom:8px}
.back::before{content:"‹ "}
.detail h2{font-size:20px;line-height:1.3;margin:0 0 4px}
.detail .addr{color:var(--muted);font-size:13px;margin:0}
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin:14px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.facts div{padding:8px 10px;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts dt{font-size:11.5px;color:var(--muted)}
.facts dd{margin:0;font-size:18px;font-weight:600}
.facts .hl dd{color:var(--hosp)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:6px;font-size:13px;font-weight:500;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.naver{background:#03A94D;border-color:#03A94D;color:#fff}
.sec-h{margin:22px 0 4px}
.sec-h h3{font-size:15px;margin:0}
.sec-h span{display:block;font-size:12px;color:var(--muted);margin-top:2px}

/* distance scale — matches the 100 / 300 / 500 m rings on the map */
.scale{position:relative;height:16px;margin:6px 0 4px;font-size:10.5px;color:var(--muted)}
.scale span{position:absolute;transform:translateX(-50%)}
.ph-list{list-style:none;margin:0;padding:0}
.ph-item{border-bottom:1px solid var(--line);padding:10px 0}
.ph-item.active{background:var(--ring-soft);margin:0 -20px;padding:10px 20px}
.ph-top{display:flex;justify-content:space-between;gap:10px;width:100%}
.ph-name{font-weight:600}
.ph-dist{font-weight:600;color:var(--rx)}
.ruler{position:relative;height:6px;margin:6px 0 6px;background:var(--tint);border-radius:3px;overflow:hidden}
.ruler i{position:absolute;left:0;top:0;bottom:0;background:var(--rx);border-radius:3px}
.ruler::before,.ruler::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:#fff;z-index:1}
.ruler::before{left:20%}.ruler::after{left:60%}
.ph-sub{font-size:12.5px;color:var(--muted)}
.ph-sub b{font-weight:500;color:var(--ink)}
.ph-links{display:flex;gap:12px;margin-top:4px;font-size:12.5px}
.ph-links a{text-decoration:none;font-weight:500}
.ph-also{font-size:12px;color:var(--muted);margin-top:2px}
.note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}

/* ---------- map ---------- */
#mapWrap{position:relative;min-height:0;height:100%}
#map{width:100%;height:100%;overflow:hidden}
.notice{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--tint)}
.notice div{max-width:440px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.notice h2{font-size:16px;margin:0 0 8px}
.notice p,.notice li{font-size:13.5px;margin:0 0 6px}
.notice ol{padding-left:18px;margin:8px 0 0}
.notice code{background:var(--tint);padding:1px 5px;border-radius:4px;font-size:12.5px}
.legend{position:absolute;left:12px;bottom:28px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px;z-index:5}
.legend span{display:flex;align-items:center;gap:7px}
.lg-h{width:12px;height:12px;border-radius:50%;background:var(--hosp);border:2px solid #fff;box-shadow:0 0 0 1px var(--hosp)}
.lg-p{width:10px;height:10px;border-radius:50%;background:var(--rx);border:2px solid #fff;box-shadow:0 0 0 1px var(--rx)}
.lg-r{width:14px;height:14px;border-radius:50%;border:1.5px dashed var(--hosp)}

/* markers (HTML icons) */
.hm{position:relative;transform:translate(-9px,-9px);white-space:nowrap;cursor:pointer}
.hm-dot{display:block;width:18px;height:18px;border-radius:50%;background:var(--hosp);border:3px solid #fff;box-shadow:0 0 0 1px var(--hosp),0 1px 4px rgba(0,0,0,.3)}
.hm.t1 .hm-dot{width:22px;height:22px;margin:-2px;background:var(--hosp)}
.hm.t3 .hm-dot{background:#fff;box-shadow:0 0 0 2px var(--hosp),0 1px 3px rgba(0,0,0,.25)}
.hm-label{position:absolute;left:22px;top:-2px;background:#fff;border:1px solid var(--hosp);color:var(--hosp);font-size:12px;font-weight:600;padding:1px 7px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hm-label b{margin-left:5px;font-weight:700}
.far .hm-label{display:none}
.hm.sel .hm-dot{box-shadow:0 0 0 3px var(--ring),0 1px 4px rgba(0,0,0,.3)}
.hm.sel .hm-label{background:var(--hosp);color:#fff;display:block}
.pm{width:12px;height:12px;transform:translate(-6px,-6px);border-radius:50%;background:var(--rx);border:2px solid #fff;box-shadow:0 0 0 1px var(--rx);cursor:pointer}
.has-sel .pm{opacity:.28}
.has-sel .pm.in{opacity:1;width:14px;height:14px;transform:translate(-7px,-7px)}
.pm.focus{background:var(--ring);box-shadow:0 0 0 2px var(--ring);opacity:1}
.hide-ph .pm{display:none!important}
.pm span{display:none}
.has-sel .pm.in{width:20px;height:20px;transform:translate(-10px,-10px);display:flex;align-items:center;justify-content:center}
.has-sel .pm.in span{display:block;color:#fff;font-size:11px;font-weight:700;line-height:1}
.ph-staff{display:inline-block;font-size:12px;font-weight:600;color:var(--rx);background:var(--rx-soft);padding:0 6px;border-radius:3px;margin-left:6px;vertical-align:1px}
.ph-staff.han{color:#7A4B00;background:var(--ring-soft)}
.h-sub{display:block;color:var(--muted);font-size:12px}
.h-ph small+small{margin-top:1px}
.facts-note{font-size:12px;color:var(--muted);margin:-6px 0 12px}
.iw{padding:10px 12px;font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:12.5px;line-height:1.5;color:var(--ink);min-width:200px;max-width:260px}
.iw strong{display:block;font-size:14px}
.iw .d{color:var(--rx);font-weight:600}
.iw a{margin-right:10px;font-weight:500;text-decoration:none}

@media (max-width: 860px){
  body{grid-template-columns:1fr;grid-template-rows:52dvh 1fr;overflow:hidden}
  #mapWrap{grid-row:1}
  #panel{grid-row:2;border-right:0;border-top:1px solid var(--line)}
  .masthead{padding:14px 16px 10px}
  .masthead h1{font-size:17px}
  .controls{padding:0 16px 10px}
  .h-row{padding:11px 16px;grid-template-columns:54px 1fr auto}
  .spec b{font-size:22px}
  .detail{padding:12px 16px 24px}
  .ph-item.active{margin:0 -16px;padding:10px 16px}
  .legend{bottom:22px;left:8px}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
</head>

const H = DATA.hosp, P = DATA.ph;
const PH = Object.fromEntries(P.map(p => [p.id, p]));
const HN = Object.fromEntries(H.map(h => [h.no, h]));
const REGIONS = ['전체','창원','진주','김해','양산','거제','사천','통영'];
const state = { region:'전체', sel:null, map:null, hm:{}, pm:{}, rings:{}, selRings:[], iw:null };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nmapUrl = q => 'https://map.naver.com/p/search/' + encodeURIComponent(q);
const area = h => `${h.sgg.replace(/^창원(.+구)$/, '창원 $1')} ${h.emd}`;
const tierClass = t => t === '상급종합' ? 't1' : (t === '종합병원' ? 't2' : 't3');
const phOf = no => P.filter(p => p.h.some(z => z[0] === no))
                    .map(p => ({ p, d: p.h.find(z => z[0] === no)[1] }))
                    .sort((a, b) => a.d - b.d);

/* ---------- panel ---------- */
function renderSummary(){
  document.getElementById('summary').textContent =
    `의과전문의 15명 이상 병원 ${H.length}곳과 반경 500m 안 약국 ${P.length}곳. 의사·약사 수는 건강보험심사평가원 신고 인원, ${DATA.basis.replace(/-/g,'.')} 기준.`;
}
function renderRegions(){
  const el = document.getElementById('regions');
  el.innerHTML = REGIONS.map(r => {
    const n = r === '전체' ? H.length : H.filter(h => h.r === r).length;
    return `<button type="button" data-r="${r}" aria-pressed="${r === state.region}">${r} ${n}</button>`;
  }).join('');
  el.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    state.region = b.dataset.r; renderRegions(); clearSel(); renderList(); fitRegion();
  };
}
function visibleH(){ return H.filter(h => state.region === '전체' || h.r === state.region).sort((a, b) => b.tot - a.tot || b.sp - a.sp); }
function renderList(){
  const list = document.getElementById('list');
  const hs = visibleH();
  list.innerHTML = hs.length ? hs.map(h => `
    <button type="button" class="h-row" data-no="${h.no}">
      <span class="spec"><b>${h.tot}</b><small>의사</small></span>
      <span><span class="h-name">${esc(h.s)}</span>
        <span class="h-meta"><span class="tier ${tierClass(h.typ)}">${esc(h.typ)}</span>${esc(area(h))}</span>
        <span class="h-sub">의과전문의 ${h.sp}명${h.rx != null ? `, 병원 약사 ${h.rx}명` : ''}</span></span>
      <span class="h-ph"><b>${h.c500}</b><small>약국</small><small>약사 ${h.rx500}</small></span>
    </button>`).join('') : '<p class="empty">이 지역에는 해당 병원이 없습니다.</p>';
  list.hidden = false;
  document.getElementById('detail').hidden = true;
  list.onclick = e => { const b = e.target.closest('.h-row'); if (b) select(+b.dataset.no); };
}
function renderDetail(no){
  const h = HN[no], items = phOf(no);
  const d = document.getElementById('detail');
  d.innerHTML = `
    <button type="button" class="back" id="back">목록으로</button>
    <h2>${esc(h.s)}</h2>${h.s !== h.n ? `<p class="addr">${esc(h.n)}</p>` : ''}
    <p class="addr"><span class="tier ${tierClass(h.typ)}">${esc(h.typ)}</span>${esc(h.a)}</p>
    <p class="addr">${esc(h.t)}${h.o ? `<span style="margin-left:10px">개설 ${esc(h.o)}</span>` : ''}</p>
    <dl class="facts">
      <div class="hl"><dt>총 의사</dt><dd>${h.tot}</dd></div>
      <div><dt>의과전문의</dt><dd>${h.sp}</dd></div>
      <div><dt>전공의</dt><dd>${h.res + h.int}</dd></div>
      <div><dt>병원 약사</dt><dd>${h.rx != null ? h.rx : '-'}</dd></div>
    </dl>
    ${(() => { const n = [
      (h.res + h.int) ? `전공의는 레지던트 ${h.res}명과 인턴 ${h.int}명의 합입니다.` : '',
      (h.dent || h.orient) ? `총 의사에는 치과의사 ${h.dent}명${h.orient ? `, 한의사 ${h.orient}명` : ''}이 포함됩니다.` : '',
      h.rx == null ? '병원 약사는 신고된 인원이 없습니다.' : ''
    ].filter(Boolean).join(' '); return n ? `<p class="facts-note">${n}</p>` : ''; })()}
    <div class="links">
      <a class="btn naver" href="${nmapUrl(h.q)}" target="_blank" rel="noopener">네이버지도에서 병원 보기</a>
      <a class="btn" href="${nmapUrl(h.qa)}" target="_blank" rel="noopener">주소로 보기</a>
    </div>
    <div class="sec-h"><h3>500m 안 약국 ${items.length}곳, 약사 ${h.rx500}명${h.hrx500 ? `, 한약사 ${h.hrx500}명` : ''}</h3><span>100m 안 ${h.c100}곳${h.near != null ? `, 가장 가까운 곳 ${h.near}m` : ''}</span></div>
    <div class="scale" aria-hidden="true"><span style="left:0;transform:none">0</span><span style="left:20%">100m</span><span style="left:60%">300m</span><span style="left:100%;transform:translateX(-100%)">500m</span></div>
    <ol class="ph-list">${items.map(({p, d}) => {
      const others = p.h.filter(z => z[0] !== no).map(z => `${esc(HN[z[0]].s)} ${z[1]}m`);
      return `<li class="ph-item" id="ph-${p.id}" data-id="${p.id}">
        <button type="button" class="ph-top" data-focus="${p.id}"><span><span class="ph-name">${esc(p.n)}</span>${p.ps ? `<span class="ph-staff">약사 ${p.ps}</span>` : ''}${p.hs ? `<span class="ph-staff han">한약사 ${p.hs}</span>` : ''}</span><span class="ph-dist">${d}m</span></button>
        <div class="ruler" aria-hidden="true"><i style="width:${Math.min(100, d / 5)}%"></i></div>
        <div class="ph-sub">${esc(p.a)}</div>
        <div class="ph-sub">${p.t ? `<b>${esc(p.t)}</b>` : '전화번호 없음'}<span style="margin-left:10px">개설 ${esc(p.o)}</span></div>
        ${others.length ? `<div class="ph-also">다른 병원과도 가까움: ${others.join(', ')}</div>` : ''}
        <div class="ph-links"><a href="${nmapUrl(p.q)}" target="_blank" rel="noopener">네이버지도</a><a href="${nmapUrl(p.qa)}" target="_blank" rel="noopener">주소로 보기</a></div>
      </li>`; }).join('')}</ol>
    <p class="note">약사 수는 약국이 심평원에 신고한 근무 약사 수입니다. 근무 형태(상근·비상근)는 구분되지 않습니다. 거리는 심평원 좌표 기준 직선거리입니다. 실제 걷는 거리와 출입구 위치에 따라 체감 거리가 다릅니다. 네이버지도 링크는 상호 검색이라 같은 이름의 다른 업소가 함께 나올 수 있으니 주소로 대조하세요.</p>`;
  document.getElementById('list').hidden = true;
  d.hidden = false;
  document.getElementById('scroll').scrollTop = 0;
  document.getElementById('back').onclick = () => { clearSel(); renderList(); fitRegion(); };
  d.querySelector('.ph-list').onclick = e => {
    const b = e.target.closest('[data-focus]'); if (b) focusPh(+b.dataset.focus, true);
  };
}

/* ---------- selection ---------- */
function select(no){
  clearSel(false);
  state.sel = no;
  renderDetail(no);
  if (!state.map) return;
  const h = HN[no], c = new naver.maps.LatLng(h.y, h.x);
  state.hm[no].el.classList.add('sel');
  state.hm[no].m.setZIndex(1000);
  document.getElementById('map').classList.add('has-sel');
  phOf(no).forEach(({p}) => state.pm[p.id].el.classList.add('in'));
  [500, 300, 100].forEach((r, i) => state.selRings.push(new naver.maps.Circle({
    map: state.map, center: c, radius: r, clickable: false,
    strokeColor: '#C98A00', strokeOpacity: .95, strokeWeight: i === 0 ? 2 : 1, strokeStyle: i === 0 ? 'solid' : 'shortdash',
    fillColor: '#FFE7A3', fillOpacity: i === 0 ? .14 : 0, zIndex: 50
  })));
  state.map.fitBounds(state.selRings[0].getBounds());
}
function clearSel(){
  if (state.iw) state.iw.close();
  if (!state.map) { state.sel = null; return; }
  if (state.sel) { state.hm[state.sel].el.classList.remove('sel'); state.hm[state.sel].m.setZIndex(100); }
  state.selRings.forEach(c => c.setMap(null)); state.selRings = [];
  document.getElementById('map').classList.remove('has-sel');
  Object.values(state.pm).forEach(o => o.el.classList.remove('in', 'focus'));
  state.sel = null;
}
function focusPh(id, pan){
  document.querySelectorAll('.ph-item.active').forEach(x => x.classList.remove('active'));
  const li = document.getElementById('ph-' + id);
  if (li) { li.classList.add('active'); if (!pan) li.scrollIntoView({block:'nearest'}); }
  if (!state.map) return;
  Object.values(state.pm).forEach(o => o.el.classList.remove('focus'));
  const o = state.pm[id]; o.el.classList.add('focus');
  if (pan) state.map.panTo(o.m.getPosition());
  openPhInfo(id);
}
function openPhInfo(id){
  const p = PH[id];
  const rows = p.h.map(z => `${esc(HN[z[0]].s)} <span class="d">${z[1]}m</span>`).join('<br>');
  const staff = [p.ps ? `약사 ${p.ps}명` : '', p.hs ? `한약사 ${p.hs}명` : ''].filter(Boolean).join(', ');
  state.iw.setContent(`<div class="iw"><strong>${esc(p.n)}</strong>${staff}<br>${p.t ? esc(p.t) + '<br>' : ''}${rows}
    <div style="margin-top:6px"><a href="${nmapUrl(p.q)}" target="_blank" rel="noopener">네이버지도</a><a href="${nmapUrl(p.qa)}" target="_blank" rel="noopener">주소로 보기</a></div></div>`);
  state.iw.open(state.map, state.pm[id].m);
}

/* ---------- map ---------- */
function fitRegion(){
  if (!state.map) return;
  const hs = visibleH(); if (!hs.length) return;
  const pad = 0.006;
  const lats = hs.map(h => h.y), lngs = hs.map(h => h.x);
  state.map.fitBounds(naver.maps.LatLngBounds.bounds(
    new naver.maps.LatLng(Math.min(...lats) - pad, Math.min(...lngs) - pad),
    new naver.maps.LatLng(Math.max(...lats) + pad, Math.max(...lngs) + pad)));
}
function initMap(){
  const mapEl = document.getElementById('map');
  const map = new naver.maps.Map(mapEl, {
    center: new naver.maps.LatLng(35.2, 128.5), zoom: 9,
    scaleControl: true, mapDataControl: false, logoControl: true,
    zoomControl: true, zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT }
  });
  state.map = map;
  state.iw = new naver.maps.InfoWindow({ content: '', borderColor: '#DCE3E0', borderWidth: 1, backgroundColor: '#fff',
    anchorSize: new naver.maps.Size(10, 8), pixelOffset: new naver.maps.Point(0, -8), maxWidth: 280 });

  H.forEach(h => {
    const pos = new naver.maps.LatLng(h.y, h.x);
    state.rings[h.no] = new naver.maps.Circle({ map, center: pos, radius: 500, clickable: false,
      strokeColor: '#24479A', strokeOpacity: .55, strokeWeight: 1, strokeStyle: 'shortdash',
      fillColor: '#24479A', fillOpacity: .04, zIndex: 10 });
    const el = document.createElement('div');
    el.className = 'hm ' + tierClass(h.typ);
    el.innerHTML = `<span class="hm-dot"></span><span class="hm-label">${esc(h.s)}<b>의사 ${h.tot}</b></span>`;
    el.title = `${h.n} (의사 ${h.tot}명, 의과전문의 ${h.sp}명)`;
    const m = new naver.maps.Marker({ map, position: pos, zIndex: 100, icon: { content: el, anchor: new naver.maps.Point(0, 0) } });
    naver.maps.Event.addListener(m, 'click', () => select(h.no));
    state.hm[h.no] = { m, el };
  });
  P.forEach(p => {
    const el = document.createElement('div');
    el.className = 'pm'; el.title = `${p.n} (약사 ${p.ps}명${p.hs ? `, 한약사 ${p.hs}명` : ''})`;
    el.innerHTML = `<span>${p.ps || (p.hs ? '한' : '')}</span>`;
    const m = new naver.maps.Marker({ map, position: new naver.maps.LatLng(p.y, p.x), zIndex: 60, icon: { content: el, anchor: new naver.maps.Point(0, 0) } });
    naver.maps.Event.addListener(m, 'click', () => {
      if (state.sel && !p.h.some(z => z[0] === state.sel)) select(p.h[0][0]);
      focusPh(p.id, false);
    });
    state.pm[p.id] = { m, el };
  });
  const zoomClass = z => mapEl.classList.toggle('far', z < 12);
  naver.maps.Event.addListener(map, 'zoom_changed', zoomClass);
  naver.maps.Event.addListener(map, 'click', () => state.iw.close());
  fitRegion(); zoomClass(map.getZoom());
}

/* ---------- options ---------- */
document.getElementById('optRings').onchange = e => Object.values(state.rings).forEach(c => c.setVisible(e.target.checked));
document.getElementById('optPh').onchange = e => document.getElementById('map').classList.toggle('hide-ph', !e.target.checked);

/* ---------- boot ---------- */
function showNotice(html){ const n = document.getElementById('notice'); n.innerHTML = `<div>${html}</div>`; n.hidden = false; }
window.navermap_authFailure = function(){
  showNotice(`<h2>지도 인증에 실패했습니다</h2>
    <p>Client ID는 맞지만 이 페이지 주소가 네이버 클라우드에 등록되지 않았을 때 주로 나타납니다.</p>
    <ol><li>네이버 클라우드 콘솔의 Maps &gt; Application &gt; 수정에서 <b>Dynamic Map</b>이 선택되어 있는지 확인하세요.</li>
    <li>Web 서비스 URL에 <code>${esc(location.protocol + '//' + location.hostname)}</code>을 경로와 포트 없이 등록하세요.</li></ol>
    <p>왼쪽 목록과 네이버지도 링크는 지도 없이도 쓸 수 있습니다.</p>`);
};
renderSummary(); renderRegions(); renderList();
const KEY = new URLSearchParams(location.search).get('key') || NCP_KEY_ID;
if (!KEY || KEY === 'YOUR_CLIENT_ID') {
  showNotice(`<h2>지도를 띄우려면 Client ID가 필요합니다</h2>
    <p>네이버 클라우드에서 발급받은 Client ID를 이 파일 아래쪽 스크립트 첫 줄의 <code>NCP_KEY_ID</code>에 넣거나, 주소 끝에 <code>?key=Client ID</code>를 붙여 여세요.</p>
    <p>왼쪽 목록과 네이버지도 링크는 지도 없이도 쓸 수 있습니다.</p>`);
} else {
  const s = document.createElement('script');
  s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(KEY);
  s.onload = () => {
    if (window.naver && window.naver.maps && window.naver.maps.Map) initMap();
    else showNotice('<h2>지도 스크립트를 불러오지 못했습니다</h2><p>새로고침한 뒤에도 같으면 Client ID와 등록한 Web 서비스 URL을 확인하세요.</p>');
  };
  s.onerror = () => showNotice('<h2>지도 스크립트를 불러오지 못했습니다</h2><p>인터넷 연결을 확인한 뒤 새로고침하세요.</p>');
  document.head.appendChild(s);
}
</script>
</body>
</html>
